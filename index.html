<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영어 일기 튜터</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 AI 영어 일기 튜터</h1>
            <nav>홈 | 서비스 소개 | 사용법</nav>
        </header>

        <main>
            <section class="input-section">
                <h2>오늘의 일기를 영어로 써보세요</h2>
                <p>중학교 수준의 쉬운 단어로도 충분합니다!</p>
                <textarea id="diaryInput" placeholder="I finally succeeded finishing my project."></textarea>
                <button id="submitBtn">AI에게 첨삭 받기</button>
            </section>

            <section id="resultSection" class="result-section" style="display: none;">
                <h3>첨삭 결과</h3>
                <div class="result-box">
                    <h4>✅ 교정된 문장</h4>
                    <p id="correctedText"></p>
                </div>
                <div class="result-box">
                    <h4>💡 학습 팁</h4>
                    <p id="explanation"></p>
                </div>
            </section>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
