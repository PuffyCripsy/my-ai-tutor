<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영어 일기 튜터</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Pretendard', sans-serif; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .result-box { background-color: #f1f7ff; border-left: 5px solid #007bff; padding: 15px; border-radius: 5px; margin-top: 10px; min-height: 50px; }
        .tip-box { background-color: #fff4f4; border-left: 5px solid #ff4d4d; padding: 15px; border-radius: 5px; margin-top: 10px; min-height: 50px; }
        .nav-link-custom { text-decoration: none; color: #6c757d; font-weight: bold; margin: 0 10px; }
        .nav-link-custom:hover { color: #007bff; }
        .active-menu { color: #007bff !important; border-bottom: 2px solid #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 상단 헤더 및 네비게이션 -->
        <div class="card p-4 mb-4 text-center">
            <h1>📝 AI 영어 일기 튜터</h1>
            <nav class="mt-3">
                <a href="index.html" class="nav-link-custom active-menu">홈</a> | 
                <a href="about.html" class="nav-link-custom">서비스 소개</a> | 
                <a href="guide.html" class="nav-link-custom">사용법</a>
            </nav>
        </div>

        <!-- 입력창 -->
        <div class="card p-4 mb-4">
            <h4 class="mb-3">오늘의 일기를 영어로 써보세요</h4>
            <p class="text-muted">중학교 수준의 쉬운 단어로도 충분합니다!</p>
            <textarea id="diary-input" class="form-control mb-3" rows="6" placeholder="예) I went to the park."></textarea>
            <button onclick="getCorrection()" id="submit-btn" class="btn btn-primary btn-lg w-100">AI에게 첨삭 받기</button>
        </div>

        <!-- 결과창 -->
        <div class="card p-4">
            <h4 class="mb-3">✨ AI 첨삭 결과</h4>
            
            <h6>✅ 교정된 문장</h6>
            <div id="correction-result" class="result-box">내용이 없습니다.</div>
            
            <h6 class="mt-4">💡 학습 팁</h6>
            <div id="tip-result" class="tip-box">내용이 없습니다.</div>
        </div>
    </div>

    <script>
        async function getCorrection() {
            const text = document.getElementById('diary-input').value;
            const btn = document.getElementById('submit-btn');
            const correctionBox = document.getElementById('correction-result');
            const tipBox = document.getElementById('tip-result');
            
            if (!text) {
                alert("일기를 입력해주세요!");
                return;
            }

            btn.disabled = true;
            btn.innerText = "AI가 분석 중...";
            correctionBox.innerText = "분석 중...";
            tipBox.innerText = "분석 중...";

            try {
                const response = await fetch('/api/correction', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                
                if (data.result) {
                    // ### 기호를 기준으로 문장과 팁을 나눕니다.
                    const parts = data.result.split('###');
                    correctionBox.innerText = parts[0].trim();
                    tipBox.innerText = parts[1] ? parts[1].trim() : "추가 팁이 없습니다.";
                } else {
                    alert("결과를 가져오지 못했습니다.");
                }
            } catch (e) {
                console.error(e);
                alert("서버 연결 오류!");
            } finally {
                btn.disabled = false;
                btn.innerText = "AI에게 첨삭 받기";
            }
        }
    </script>
</body>
</html>
